version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  # Explicit correctness and maintainability checks, verified with make lint.
  default: none
  enable:
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - govet
    - ineffassign
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
