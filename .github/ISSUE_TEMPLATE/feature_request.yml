name: Feature request
description: Propose a change to the language, the CLI, a protocol server, or the Go API.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language syntax or semantics
        - CLI
        - Kafka runtime and recovery
        - Advocate MCP server
        - Counsel language server
        - Public Go API (canon)
        - Tooling, CI, or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or impossible today? A concrete program or command sequence helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? For language changes, sketch the statement in the courtroom register and note the grammar and bytecode impact.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Does this change stored JSON, the topic layout, bytecode, or the public Go API? See docs/adr/0001-runtime-boundaries.md and docs/api-compatibility.md.
