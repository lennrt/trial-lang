# Keep Go modules, GitHub Actions, and the pinned Compose broker image current.
# Tool versions pinned in the Makefile (golangci-lint, goimports, govulncheck,
# go-licenses, actionlint) are not managed here; bump them deliberately and
# record the change in docs/toolchain.md.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(broker)"
