# Record the Kafka recovery demo for review. This workflow does not write to
# the repository or publish the artifact.
name: Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

jobs:
  recording:
    name: Record Kafka recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build
      - name: Install recording tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/ttyd" \
            https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          echo "8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55  $RUNNER_TEMP/ttyd" \
            | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/ttyd" /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@v0.11.0
      - name: Check generated demo
        run: make demo-check
      - name: Pull the pinned Kafka image
        run: docker compose pull the-court
      - name: Verify recovery against Kafka
        run: |
          set -euo pipefail
          chmod +x docs/the-recovery-demo.sh
          timeout --signal=TERM --kill-after=10s 3m \
            env TRIAL_RECOVERY_DELAY=0 ./docs/the-recovery-demo.sh
      - name: Record demo
        run: |
          set -euo pipefail
          vhs docs/the-recovery.tape
      - name: Upload recording for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: the-recovery
          path: docs/the-recovery.gif
          if-no-files-found: error
