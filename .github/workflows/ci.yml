name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: >-
          make fmt-check tidy-check vet test lint api-check workflow-check
          purego arm64 demo-check examples
      - run: go run ./cmd/trial version

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -timeout=10m ./...

  fuzz:
    name: Fuzz parser and framing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make fuzz

  kafka:
    name: Kafka integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Wait for Kafka
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/trial" ./cmd/trial
          for attempt in $(seq 1 30); do
            if "$RUNNER_TEMP/trial" docket --broker localhost:9092 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Kafka did not become ready within 60 seconds" >&2
          exit 1
      - name: Run integration tests
        run: go test -timeout=10m ./internal/court ./cmd/trial -run '^(TestE2E|TestDifferential|TestCLI)' -count=1 -v
        env:
          TRIAL_E2E_BROKER: localhost:9092
      - name: Run black-box CLI smoke test
        run: bash scripts/kafka-cli-smoke.sh
        env:
          TRIAL_BIN: ${{ runner.temp }}/trial
          TRIAL_E2E_BROKER: localhost:9092
